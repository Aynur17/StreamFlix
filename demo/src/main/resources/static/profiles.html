<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <title>Profiles - StreamFlix</title>

</head>

    <body>

    <header>
        <a href="index.html">
            <h1 class="logo">STREAMFLIX</h1>
        </a>
    </header>

    <main class="profile-container">
        <h2>Who is watching?</h2>

        <section class="profiles" id="profiles-container">
        </section>

            <div class="add-profile-form" id="add-profile-section" hidden>

                <h2>Create a profile</h2>

                <form id="profile-form">
                    <label for="profile-name">Name</label>
                    <input type="text" name="profile-name" id="profile-name" placeholder="Enter your profile name here" maxlength="30" required>

                    <label for="age-category">Age category</label>
                    <select name="age-category" id="age-category" required>
                        <option value="" disabled selected>Select an age category</option>
                        <option value="6">6+</option>
                        <option value="9">9+</option>
                        <option value="12">12+</option>
                        <option value="16">16+</option>
                        <option value="18">18+</option>
                    </select>

                    <p>Choose an avatar (optional)</p>

                    <div class="avatar-options">
                        <label>
                            <input type="radio" name="avatar" value="profile1.png"> <!-- value=example -->
                            <img src="images/profile1.png" alt="Avatar 1">
                        </label>

                        <label>
                            <input type="radio" name="avatar" value="profile2.png">
                            <img src="images/profile2.png" alt="Avatar 2">
                        </label>

                        <label>
                            <input type="radio" name="avatar" value="profile3.png">
                            <img src="images/profile3.png" alt="Avatar 3">
                        </label>
                    </div>

                    <button type="submit">Create profile</button>
                    <button type="reset">Reset</button>
                    <button type="button" id="cancel">Cancel</button>
                </form>

            </div>

    </main>

    <script src="js/profiles.js"></script>
    </body>
</html>
