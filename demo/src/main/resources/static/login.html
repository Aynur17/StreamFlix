<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <title>Login - StreamFlix</title>

    <link rel="stylesheet" href="css/style.css">
</head>

    <body>

    <header>
        <a href="index.html">
            <h1 class="logo">STREAMFLIX</h1>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <main class="container">

        <div class="authorization-box">
            <h2>Welcome back</h2>
            <p>Log in to your StreamFlix account</p>

            <form>
                <label for="email">Email address</label>
                <input type="email" name="email" id="email">

                <label for="password">Password</label>
                <input type="password" name="password" id="password">

                <a href="#" class="forgot-password">Forgot password?</a> <!-- later add: forgot-password.html -->

                <button type="submit" class="authorization-button">Login</button>
            </form>

            <p class="link">Don't have an account? <a href="register.html">Register here</a></p>

        </div>
    </main>

    </body>
