<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">

    <title>Login - StreamFlix</title>

    <link rel="stylesheet" href="css/style.css">
</head>
    <body>

        <header>
            <h1>StreamFlix</h1>

            <nav>
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
            </nav>
        </header>

    <main class="container">
        <div class="authorization-box">
            <h2>Create account</h2>
            <p>Join StreamFlix now</p>

            <form>
                <label for="email">Email address</label>
                <input type="email" name="email" id="email">

                <label for="password">Password</label>
                <input type="password" name="password" id="password">

                <label for="password-confirm">Confirm Password</label>
                <input type="password" name="password-confirm" id="password-confirm" placeholder="Confirm your password" required>

                <button type="submit" class="authorization-button">Create Account</button>
            </form>
        <p class="link">Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </main>
    </body>
